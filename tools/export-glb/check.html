<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const p = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(1280, 720); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(p.get('bg') || '#d9b48f');
s.add(new THREE.HemisphereLight(0xffe2c0, 0x5a5040, 1.2));
const sun = new THREE.DirectionalLight(0xffd2a0, 2.6); sun.position.set(-55, 42, 72); s.add(sun);
const c = new THREE.PerspectiveCamera(+p.get('fov') || 72, 1280 / 720, 0.05, 2000);
const [x, y, z, tx, ty, tz] = p.get('cam').split(',').map(Number);
c.position.set(x, y, z); c.lookAt(tx, ty, tz);
new GLTFLoader().load('/godot/models/' + p.get('f'), (g) => { s.add(g.scene); r.render(s, c); window.__done = true; }, undefined, (e) => { window.__done = String(e); });
</script></body></html>
