# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: cross_system_signals
    status: active
    api: "Events autoload signals connected with signal.connect(callable)"
    not: "String-based connect(); direct references between systems"
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    reason: "Godot signals belong to an object; one stateless hub keeps systems decoupled and testable"
    referenced_by:
      - docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30
    revised: ""

  - purpose: dependency_injection
    status: active
    api: "@export properties or an explicit setup() call"
    not: "_init() arguments"
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    reason: "Scenes instanced from the editor cannot receive _init arguments"
    referenced_by:
      - docs/architecture/adr-0001-godot-port-strategy.md
      - docs/architecture/adr-0002-game-data-format.md
      - docs/architecture/adr-0003-save-profiles.md
    added: 2026-10-30
    revised: ""

  - purpose: game_data_access
    status: active
    api: "GameData (RefCounted) loaded by the root scene and passed to systems by setup()"
    not: "Opening files in assets/data/ from gameplay code; GameData as an @export, autoload or static global"
    adr: docs/architecture/adr-0002-game-data-format.md
    reason: "One validated, typed source of game data that tests can replace with fixtures; @export cannot hold a RefCounted (checked on 4.7.2)"
    referenced_by:
      - docs/architecture/adr-0002-game-data-format.md
    added: 2026-10-30
    revised: ""

  - purpose: profile_persistence
    status: active
    api: "Versioned JSON in user://profiles/slot_<n>.json written by ProfileStore (tmp, .bak, rename)"
    not: "ResourceSaver/ResourceLoader or store_var/get_var for saves; accounts or passwords"
    adr: docs/architecture/adr-0003-save-profiles.md
    reason: "Readable, migratable, and an edited save cannot run code"
    referenced_by:
      - docs/architecture/adr-0003-save-profiles.md
    added: 2026-10-30
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: hardcoded_gameplay_values
    status: active
    description: "Gameplay values (speeds, damage, timers, prices) must come from assets/data/, never from literals in scripts."
    why: "Balance must stay editable outside code and match the design docs."
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30

  - pattern: gameplay_references_ui
    status: active
    description: "Gameplay code must never reference UI nodes; the UI listens to signals."
    why: "Keeps gameplay testable headless and the UI replaceable."
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30

  - pattern: unregistered_autoload
    status: active
    description: "No autoload other than Events may be added without an ADR."
    why: "Autoloads are hidden global dependencies that make systems hard to test in isolation."
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30

  - pattern: string_based_connect
    status: active
    description: "Never use connect(\"signal\", obj, \"method\"); use signal.connect(callable)."
    why: "Deprecated since Godot 4.0; not type-safe (docs/engine-reference/godot/deprecated-apis.md)."
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30

  - pattern: device_zero_input_check
    status: active
    description: "Never detect mouse or keyboard with event.device == 0; use the event type or InputEvent.DEVICE_ID_MOUSE / DEVICE_ID_KEYBOARD."
    why: "Since Godot 4.7 some joypads use device 0 (docs/engine-reference/godot/breaking-changes.md)."
    adr: docs/architecture/adr-0001-godot-port-strategy.md
    added: 2026-10-30

  - pattern: definition_mutation
    status: active
    description: "Never change a GameData definition at runtime; copy values into an instance object (stack, durability, charge)."
    why: "Definitions are shared by every user of an id; a write changes them for all of them."
    adr: docs/architecture/adr-0002-game-data-format.md
    added: 2026-10-30

  - pattern: data_read_before_setup
    status: active
    description: "Systems must not read game data in _ready() or earlier; only in or after setup(data)."
    why: "Children's _ready() runs before the root scene's, which is where setup() is called (checked on 4.7.2)."
    adr: docs/architecture/adr-0002-game-data-format.md
    added: 2026-10-30

  - pattern: resource_or_var_saves
    status: active
    description: "Never save or load a profile with ResourceSaver/ResourceLoader or store_var/get_var on objects; use ProfileStore JSON."
    why: "A resource file can instantiate scripts named in it, so an edited save could run code; JSON is also easier to migrate."
    adr: docs/architecture/adr-0003-save-profiles.md
    added: 2026-10-30

  - pattern: change_scene_to
    status: active
    description: "Never call change_scene_to_file or change_scene_to_packed; the root scene swaps its children (remove and free, instance, add_child, setup)."
    why: "The root scene owns GameData and the Profile for the whole session; replacing it would drop them."
    adr: docs/architecture/adr-0003-save-profiles.md
    added: 2026-10-30

  - pattern: unchecked_int_conversion
    status: active
    description: "Never call int() on a loaded value without checking its type first."
    why: "int() on an Array is a script error that aborts the function (checked on Godot 4.7.2), so a malformed save would break loading."
    adr: docs/architecture/adr-0003-save-profiles.md
    added: 2026-10-30

